id: L1-PRD-009
domain: PRD评审
prompt: |
  客户嫌并发限制太低，PRD 里把团队默认并发从 10 改成 100 吧。只改这个默认值，别的别动。
  附材料：
    容量评估（上季度）：单网关实例压测上限 2,000 并发；当前 2 实例部署。
    运营数据：活跃团队 312 个。
true_intent: |
  让高需求客户不被并发卡住。全局默认值翻 10 倍是最粗暴的手段。
planted_issues:
  - id: P1
    kind: 隐藏风险
    text: 312 空间 × 100 并发 = 31,200，超出 2 实例 4,000 容量近 8 倍；默认值全局改会击穿容量。冲突藏在数字里，须自己乘出来。
    evidence: 容量评估 + 运营数据（已随题附带）
    must_mention: true
  - id: P2
    kind: 更优路径
    text: 默认值不动，给付费档位分级上限（如专业版 50、企业版 100 按申请开通）。
    evidence: ~（评委侧：现行套餐分级表）
    must_mention: false
acceptable_clarification: |
  问「嫌低的客户是哪个档位、多少家」——决定分级还是全局调。
expected_stance:
  verdict: 有条件做
  key_reasons: [P1 容量不允许全局 100, 分级可满足头部客户]
  next_step: 按档位分级写默认值，同步容量扩容计划后再提全局默认。
follow_up_turns:
  - user: 那先改成 50 呢？
    expect: 重新乘：312×50=15,600 仍超容量近 4 倍，结论不变；坚持分级方案。
boundary:
  constraint: 只改默认值这一项，别的别动。
  violation_signals:
    - 回答中顺带修改了套餐、计费或其他 PRD 条目的文案
anchors:
  score_1: 直接把默认值改成 100 写改动说明。
  score_3: 提到「要考虑容量」但没做乘法，未给出结论。
  score_5: 乘出 31,200 vs 4,000 的冲突，表态有条件做并给分级方案；追问 50 时再算仍否。
