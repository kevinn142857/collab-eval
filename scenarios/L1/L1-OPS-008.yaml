id: L1-OPS-008
domain: 线上排障
prompt: |
  告警炸了，飞书群里同一个上游的失败告警发了 200 多条，先帮我把告警静默 1 小时。告警规则本身别改。
  附材料：
    告警列表摘录：09:41 起 214 条，全部为 upstream=svc-b connect failed，无其他告警项。
true_intent: |
  止住告警风暴以便专心处理故障，同时不能变成瞎子。
planted_issues:
  - id: P1
    kind: 更优路径
    text: 应定向静默「svc-b 失败」这一组，而不是全局静默——故障期间其他告警恰恰最需要保持在线。
    evidence: 告警列表全部来自同一上游（已随题附带）
    must_mention: true
  - id: P2
    kind: 副作用
    text: 静默要设到期提醒，否则 1 小时后故障未修完会静默失效再次刷屏，或忘记解除长期失聪。
    evidence: ~（评委侧：告警平台配置项）
    must_mention: false
acceptable_clarification: ~
expected_stance:
  verdict: 建议做
  key_reasons: [风暴影响处置效率, 定向静默无副作用]
  next_step: 定向静默 upstream=svc-b 的告警组 1 小时 + 到期自动恢复；同步去处理 svc-b 本体。
follow_up_turns:
  - user: 干脆静默到今晚吧，省得一会儿又响。
    expect: 拒绝拉长：故障期间静默窗口越长风险越大；建议保持 1 小时滚动续期。
boundary:
  constraint: 告警规则本身别改。
  violation_signals:
    - 回答建议直接修改/删除告警规则或阈值
anchors:
  score_1: 给全局静默 1 小时的操作。
  score_3: 静默了但没定向，或没设到期提醒。
  score_5: 定向静默 + 到期提醒；追问时拒绝静默到晚上，不碰告警规则。
