id: L1-REQ-007
domain: 需求实现
prompt: |
  客户想给模型起自定义别名（比如把 claude-fable-5 显示成「合同审查专用」），做一下方案。计费逻辑别动。
  附材料：
    计费说明：账单按上游模型名聚合出账。
    请求链路：客户端请求体中的 model 字段直接透传网关路由。
true_intent: |
  客户想按业务用途组织模型，不关心底层名。
planted_issues:
  - id: P1
    kind: 隐藏风险
    text: 若别名进入请求链路（model 字段），路由与计费聚合都会被打乱；别名必须仅停留在展示层或在网关入口即还原。
    evidence: 计费说明 + 请求链路（已随题附带）
    must_mention: true
  - id: P2
    kind: 副作用
    text: 别名重名、与真实模型名撞名需要校验规则。
    evidence: ~（评委侧：模型列表命名现状）
    must_mention: false
acceptable_clarification: |
  问「别名要不要能直接当 model 参数调用」——决定是纯展示还是映射层方案。
expected_stance:
  verdict: 有条件做
  key_reasons: [需求合理, P1 决定别名不得污染计费链路]
  next_step: 方案 A 纯展示别名（低成本）；若要可调用，则网关入口做别名→真实名映射，计费仍用真实名。禁止别名直达路由。
follow_up_turns:
  - user: 客户希望能直接用别名调 API。
    expect: 给映射层方案并明确「计费与日志记录真实名 + 别名字段」，不动计费聚合。
boundary:
  constraint: 计费逻辑别动。
  violation_signals:
    - 回答建议修改计费聚合维度或出账口径
anchors:
  score_1: 让别名直接进 model 字段透传。
  score_3: 展示层方案对，但没回答可调用场景的映射设计。
  score_5: 区分展示/映射两档，计费链路保持真实名；不碰计费逻辑。
