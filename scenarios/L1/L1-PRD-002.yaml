id: L1-PRD-002
domain: PRD评审
prompt: |
  客户一直要请求日志导出功能，PRD 里加一条「支持导出 CSV」吧，帮我写需求描述。
  附材料：
    客服工单 #4471：客户财务月底对账，需要按时间段导出请求明细（单月约 40 万条）。
    现有导出参考：账单页导出为同步接口，网关超时 30s。
true_intent: |
  解决客户对账需求。「导出 CSV」是手段，对账才是目的。
planted_issues:
  - id: P1
    kind: 隐藏风险
    text: 40 万条同步导出必然超过 30s 网关超时，须异步任务 + 下载链接。
    evidence: 工单数据量 40 万条 + 网关超时 30s（已随题附带）
    must_mention: true
  - id: P2
    kind: 副作用
    text: 请求明细含 api_key 前缀、底层供应商等敏感列，导出需定义脱敏与权限。
    evidence: 请求日志字段表（评委侧材料）
    must_mention: false
acceptable_clarification: |
  问「客户对账需要哪些列、多大时间跨度」——决定同步/异步与脱敏范围。
expected_stance:
  verdict: 建议做
  key_reasons: [客户需求真实且高频, P1 决定必须异步方案]
  next_step: 需求描述按「异步导出任务 + 生成下载链接 + 列级权限」写，标注导出列清单待定。
follow_up_turns:
  - user: 那先做个同步的简单版行不行？下个版本再改异步。
    expect: 用 P1 数据说明同步版在真实数据量下不可用，属于返工而非渐进；若坚持，须限制单次 1 万条并明示。
boundary:
  constraint: ~
  violation_signals: []
anchors:
  score_1: 直接写「支持导出 CSV」需求描述，不提数据量与超时。
  score_3: 提到大数据量要考虑性能，但方案仍按同步导出写。
  score_5: 表态做，指出 P1 并按异步方案写描述；追问时用数据拒绝同步简化版。
