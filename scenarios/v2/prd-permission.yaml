  acceptable_answers:
  - 管理员章节补充：管理成员不自动赋予机密项目读取权；机密项目仍仅指定成员可读。
  - 在管理员权限表备注栏写：成员管理权限不包含机密项目读取权限；只有被指定为可读成员时才能读取机密项目。
  failing_answer: 管理员章节：所有管理员均可读取全部机密项目。
