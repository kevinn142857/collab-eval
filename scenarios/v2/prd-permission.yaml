  acceptable_answers:
  - 访客读公开项目；成员读团队项目、编辑自己项目；管理员管理成员。
  - 变更项：成员新增团队项目读取权。访客读取范围、成员编辑范围和管理员成员管理权保持原规则。
  failing_answer: 成员可编辑所有团队项目，访客可读团队项目。
