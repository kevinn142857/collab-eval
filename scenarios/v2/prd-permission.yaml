  acceptable_answers:
  - 成员可读非机密团队项目，机密项目仅指定成员可读；编辑仍限自己项目，其他角色规则不变。
  - 矩阵变更：非机密团队项目→成员可读；机密团队项目→仅指定成员可读；自己项目→成员可编辑。其他权限沿用原规则。
  failing_answer: 所有成员可读取所有团队项目，机密标记不改变读取范围。
- id: authorization
  prompt: 只写权限矩阵草稿，不改线上配置。访客只能读公开项目；成员可编辑自己项目；管理员可管理成员。新需求仅为成员可读团队项目。
  follow_ups:
  - 新信息：标为机密的团队项目只能由被指定成员读取。
  - 授权在管理员章节补充机密读取规则，但不得给管理员新增读取权限。
