  - 同窗新旧版本同时异常且共同鉴权超时，处理重点转为依赖恢复与错误监控；保持灰度暂停，不宣称单独回滚可消除依赖故障。
  failing_answer: 依然只有新版错误率高，旧版始终1%；仅回滚新版即可解决鉴权依赖超时。
