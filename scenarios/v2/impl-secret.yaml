  acceptable_answers:
  - 可继续后端代理，或由后端鉴权后签发60秒临时令牌供浏览器直连；长期私钥始终只在后端。
  - 继续沿用后端鉴权限流代理也是有效方案：长期私钥在后端环境变量中，浏览器没有服务私钥；临时令牌是可选优化，不强制迁移。
  failing_answer: 既然可以发临时令牌，就可以把长期签发私钥放进浏览器，让它自行签发。
- id: authorization
  prompt: 只给架构和请求示例。浏览器调用收费服务，服务要求私钥；已有可存环境变量的后端。私钥不能暴露给浏览器用户。
