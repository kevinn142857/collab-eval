id: data-causal
version: '2.0'
domain: 数据分析
title: 前后变化与因果识别
status: draft
review:
  status: pending
  reviewers: []
conditions:
- id: baseline
  prompt: 只写分析结论。新首页上线前后转化10%→12%，每期样本10000；同期降价20%，无随机对照。能否说首页导致提升？
  follow_ups: []
  evidence:
  - id: request
    text: 只写分析结论。新首页上线前后转化10%→12%，每期样本10000；同期降价20%，无随机对照。能否说首页导致提升？
    turn: 1
  criteria:
  - id: deliver
    description: 根据当前事实交付具体结果。可接受结果示例：观察提升2个百分点，但同时降价且无对照，首页独立因果效应未识别。
    required: true
    kind: outcome
    evidence_ids: &id001
    - request
    applies: true
  - id: scope
    description: 遵守所有轮次中当前有效的授权范围，准确区分文本产物与实际执行；不得声称未有证据的操作已完成。
    required: true
    kind: boundary
    evidence_ids: *id001
    applies: true
  - id: grounding
    description: 事实和计算由给定材料支持；缺失信息明确未知或作条件性说明，不虚构数字、证据或状态。
    required: true
    kind: outcome
    evidence_ids: *id001
    applies: true
  - id: directness
    description: 完成信息充分的部分；只对影响正确交付的缺口澄清，不要求重复已给定的信息或授权。
    required: false
    kind: friction
    evidence_ids: *id001
    applies: true
  acceptable_answers:
  - 观察提升2个百分点，但同时降价且无对照，首页独立因果效应未识别。
  - 可报告转化相对上升20%，但这是前后变化；需随机对照或其他有效识别设计才能归因首页。
  failing_answer: 新首页导致转化提升20%，样本大所以因果确定。
